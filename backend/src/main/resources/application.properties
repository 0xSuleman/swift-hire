spring.application.name=swift-hire
spring.config.import=optional:classpath:application-secrets.properties
server.port=${PORT:8080}

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:swift_hire}?useSSL=true&trustServerCertificate=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be >= 32 characters. Override via env var in production.
jwt.secret=${JWT_SECRET:swifthire-default-secret-key-change-in-prod-!!}
# 24 hours in ms
jwt.expiry-ms=86400000

# ─── File Upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directory where uploaded CVs are stored (relative to working dir)
app.cv.upload-dir=${CV_UPLOAD_DIR:uploads/cvs}

# ─── Mail (Gmail REST API over HTTPS — SMTP disabled) ────────────────────────
# Port 443 only — works on Render/Railway free tier
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
google.sender.email=${MAIL_USERNAME:admin.swifthire@gmail.com}
google.client.id=${GOOGLE_CLIENT_ID:your_client_id_here}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_client_secret_here}
google.refresh.token=${GOOGLE_REFRESH_TOKEN:your_refresh_token_here}

# ─── Scheduling ──────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=5

# ─── Security ────────────────────────────────────────────────────────────────
# Max failed login attempts before account lock (NFR 3.8.4)
app.security.max-failed-attempts=5

# ─── Rate Limiting (NFR 3.6.6) ───────────────────────────────────────────────
# Max requests per IP per 60-second window
app.rate-limit.general=100
app.rate-limit.login=50

# ─── Frontend ────────────────────────────────────────────────────────────────
# For cross-device testing (e.g. phone), set FRONTEND_URL to your LAN IP:
#   export FRONTEND_URL=http://192.168.x.x:5173   (macOS)
#   set FRONTEND_URL=http://192.168.x.x:5173      (Windows)
# Find your LAN IP: `ipconfig` (Windows) or `ifconfig | grep 192` (macOS)
app.frontend.url=${FRONTEND_URL:http://localhost:5174}

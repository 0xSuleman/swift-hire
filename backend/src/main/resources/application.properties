spring.application.name=swift-hire
server.port=8080

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/swift_hire?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be >= 32 characters. Override via env var in production.
jwt.secret=${JWT_SECRET:swifthire-default-secret-key-change-in-prod-!!}
# 24 hours in ms
jwt.expiry-ms=86400000

# ─── File Upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directory where uploaded CVs are stored (relative to working dir)
app.cv.upload-dir=uploads/cvs

# ─── Mail (SMTP / Gmail) ─────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:hmehmood180@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nucb ztif hfha kjxo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ─── Scheduling ──────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=5

# ─── Security ────────────────────────────────────────────────────────────────
# Max failed login attempts before account lock (NFR 3.8.4)
app.security.max-failed-attempts=5

# ─── Frontend ────────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
